            lastName:
              type: string
              nullable: true
            isPending:
              type: boolean
            mfaEnabled:
              type: boolean
            createdAt:
              type: string
            updatedAt:
              type: string
            role:
              type: string
          required:
            - id
            - email
            - firstName
            - lastName
            - isPending
            - mfaEnabled
            - createdAt
            - updatedAt
  '400':
    $ref: ../../../../shared/spec/responses/badRequest.yml
  '401':
