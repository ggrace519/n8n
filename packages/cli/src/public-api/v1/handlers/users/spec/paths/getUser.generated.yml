operationId: getUser
tags:
  - User
summary: Get user by ID/Email
description: Retrieve a user from your instance. Only available for the instance owner.
x-required-scope: user:read
parameters:
  - $ref: ../../../../shared/spec/parameters/offset.yml
  - $ref: ../../../../shared/spec/parameters/limit.yml
  - $ref: ../../../../shared/spec/parameters/cursor.yml
  - schema:
      type: string
    required: true
    name: id
    in: path
  - schema:
      type: string
    required: false
    name: includeRole
    in: query
x-eov-operation-id: unreachable
x-eov-operation-handler: v1/handlers/decorator-routed.handler
x-decorator-routed: true
responses:
