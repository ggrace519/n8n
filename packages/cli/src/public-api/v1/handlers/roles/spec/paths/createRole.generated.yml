    description: Operation successful.
    content:
      application/json:
        schema:
          type: object
          properties:
            slug:
              type: string
            displayName:
              type: string
            description:
              type: string
              nullable: true
            systemRole:
              type: boolean
            roleType:
              type: string
              enum:
                - project
                - global
            scopes:
              type: array
              items:
                type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required:
